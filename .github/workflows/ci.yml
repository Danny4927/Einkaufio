name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / fmt-clippy-test-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend verification
        run: make ci-backend

  web:
    name: web / build-e2e-visual-capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Build, install Playwright and run E2E/screenshot smoke tests
        run: make ci-web PLAYWRIGHT_INSTALL="npx playwright install --with-deps chromium"
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  terraform:
    name: infrastructure / terraform-format-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform verification
        run: make ci-terraform

  contracts:
    name: contracts / yaml-openapi-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
      - name: Install yamllint
        run: python -m pip install yamllint==1.35.1
      - name: Lint YAML and OpenAPI contract
        run: make ci-contracts

  agent-config:
    name: agent-config / settings-hook-shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hook test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck
      - name: Validate settings and hook behavior
        run: make agent-config-check
