name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend / fmt-clippy-test-architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path backend/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --manifest-path backend/Cargo.toml --workspace
      - name: Architecture checker unit tests
        run: python3 -m unittest discover -s tests/architecture -p 'test_*.py'
      - name: Architecture boundaries
        run: python3 scripts/check_architecture.py

  web:
    name: web / build-e2e-visual-capture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Resolve exact dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install from generated lockfile
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and screenshot smoke tests
        run: npm run e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/web/package-lock.json
          if-no-files-found: ignore
          retention-days: 14

  terraform:
    name: infrastructure / terraform-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform validate
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/environments/dev infra/terraform/environments/prod; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
