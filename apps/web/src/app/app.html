<div class="page-shell">
  <nav class="topbar" aria-label="Hauptnavigation">
    <a class="brand" [routerLink]="auth.isAuthenticated() ? '/listen' : '/'" aria-label="Einkaufio Startseite"><span class="brand-mark" aria-hidden="true">e</span><span>Einkaufio</span></a>
    <div class="topbar-actions">
      @switch (auth.status()) {
        @case ('signed-in') {
          <a class="ghost" routerLink="/listen">Meine Listen</a>
          <button class="secondary" type="button" (click)="signOut()">Abmelden</button>
        }
        @case ('pending') {
          <span class="topbar-note">Gemeinsam einfacher einkaufen</span>
        }
        @default {
          <button class="secondary" type="button" (click)="signIn()">Anmelden</button>
        }
      }
    </div>
  </nav>
  <main>
    <router-outlet />
  </main>
  <footer>Ein guter Einkauf beginnt gemeinsam.</footer>
</div>
