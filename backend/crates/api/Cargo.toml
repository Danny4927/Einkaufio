[package]
name = "einkaufio-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
einkaufio-adapters = { path = "../adapters" }
einkaufio-application = { path = "../application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
