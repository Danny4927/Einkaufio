openapi: 3.1.0
info:
  title: Einkaufio API
  version: 1.0.0
  description: |
    Platform-neutral REST API used by the Angular PWA and future native Android client.
    Authenticated endpoints require a Cognito access token. The API is the source of truth
    for authorization and business rules.
servers:
  - url: https://{apiHost}
    variables:
      apiHost:
        default: example.lambda-url.eu-central-1.on.aws
security:
  - CognitoAccessToken: []
tags:
  - name: Profile
  - name: Lists
  - name: Items
  - name: Households
  - name: Invitations
  - name: Sync
paths:
  /health:
    get:
      security: []
      tags: [Profile]
      summary: Minimal health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/me:
    get:
      tags: [Profile]
      summary: Get the caller's profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Profile]
      summary: Create (no expectedVersion) or update (with expectedVersion) the caller's profile
      description: The profile id is always the verified principal; it cannot be supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '201':
          description: Created profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Profile]
      summary: Delete the caller's account data (GDPR erasure, ADR 018)
      description: |
        Deletes the profile, personal lists with items, memberships, invitations created by the
        caller and households the caller owns alone. If the caller owns a household with other
        active members, nothing is deleted and the response is 409
        `owner_must_transfer_ownership`. Items the caller added to household lists stay with the
        household. Idempotent; repeat after 409 `version_conflict` or 503. The Cognito user is
        deleted separately by the client.
      responses:
        '204': { description: Account data deleted }
        '409': { $ref: '#/components/responses/RuleConflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/me/export:
    get:
      tags: [Profile]
      summary: Export the caller's personal data as JSON (GDPR access/portability, ADR 018)
      responses:
        '200':
          description: Export document (download)
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists:
    get:
      tags: [Lists]
      summary: List shopping lists accessible to the current user
      description: |
        Owned personal lists and lists of households in which the caller is an active member
        (ADR 015). Access is resolved from persisted ownership and membership on every request.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Accessible lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Lists]
      summary: Create a personal list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '201':
          description: Created list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    patch:
      tags: [Lists]
      summary: Rename a list (administrator only)
      description: Contributors receive 403; callers without access receive 404 (no existence leak).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedVersion]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Renamed list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Lists]
      summary: Delete a list and its items (administrator only)
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/items:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Items]
      summary: Page through the items of a list in position order
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Item page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Items]
      summary: Add an item with the expected list version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          description: Created item and new list version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemMutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ItemId'
    patch:
      tags: [Items]
      summary: Check/uncheck or update item details with optimistic concurrency
      description: |
        Send either `checked` alone, or `name` with optional `quantity`, `unit` and `note`.
        Mixing both or sending neither is rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: Updated item and new list version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemMutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Items]
      summary: Delete item with optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: Deleted; new list version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/item-order:
    parameters:
      - $ref: '#/components/parameters/ListId'
    put:
      tags: [Items]
      summary: Reorder items; index n in itemIds becomes position n
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedListVersion, itemIds]
              properties:
                expectedListVersion: { type: integer, minimum: 1 }
                itemIds:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Reordered items and new list version
          content:
            application/json:
              schema:
                type: object
                required: [items, listVersion]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShoppingItem' }
                  listVersion: { type: integer, minimum: 1 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households:
    get:
      tags: [Households]
      summary: List households in which the caller is an active member
      responses:
        '200':
          description: Households with the caller's role
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HouseholdSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Households]
      summary: Create a household; the caller becomes its owner
      description: At most 5 households per user (owned or joined).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/HouseholdName' }
              additionalProperties: false
      responses:
        '201':
          description: Created household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
        '409': { $ref: '#/components/responses/RuleConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households/{householdId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags: [Households]
      summary: Get the household and its active members (members only)
      description: Callers who are not active members receive 404 (no existence leak).
      responses:
        '200':
          description: Household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [Households]
      summary: Rename the household (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedVersion]
              properties:
                name: { $ref: '#/components/schemas/HouseholdName' }
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Renamed household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Households]
      summary: Delete the household with its lists, items, memberships and invitations (owner only)
      description: |
        When the response is sent, the household and everything it owns are inaccessible to
        everyone; storage cleanup may continue in bounded batches (ADR 017).
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households/{householdId}/lists:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      tags: [Households]
      summary: Create a household-owned list (any active member)
      description: |
        At most 20 lists per household. Household lists appear in `GET /api/lists` for every
        active member; the owner administers them, members contribute (ADR 015).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '201':
          description: Created list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RuleConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households/{householdId}/members:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags: [Households]
      summary: List the active members (members only)
      responses:
        '200':
          description: Members ordered by user id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HouseholdMember' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households/{householdId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 128 }
    delete:
      tags: [Households]
      summary: Remove another member (owner only)
      description: |
        Removing the owner is rejected with `owner_must_transfer_ownership`; a user who is not
        an active member yields 404. Members leave with `POST .../leave`.
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: Household after the removal (new version)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RuleConflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households/{householdId}/leave:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      tags: [Households]
      summary: Leave the household (any member except the owner)
      description: The owner receives `owner_must_transfer_ownership` and must transfer or delete first.
      responses:
        '204': { description: Membership ended; access to household lists ends with it }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RuleConflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households/{householdId}/transfer-ownership:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    post:
      tags: [Households]
      summary: Make an active member the owner (owner only); the caller stays a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerId, expectedVersion]
              properties:
                newOwnerId: { type: string, minLength: 1, maxLength: 128 }
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Household after the transfer, with the caller's new role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/invites:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Invitations]
      summary: Create invitation to personal list (deferred to v1.x, ADR 015; not implemented)
      x-deferred: v1.x
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Raw token returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
  /api/households/{householdId}/invites:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
    get:
      tags: [Invitations]
      summary: List the household's invitations (owner only); never includes tokens
      responses:
        '200':
          description: Invitations ordered by id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Invite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Invitations]
      summary: Create a household invitation (owner only)
      description: |
        At most 5 valid invitations per household. The raw token is returned once and never
        stored; `inviteUrl` carries it in the URL fragment (ADR 018).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Raw token returned once
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RuleConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households/{householdId}/invites/{inviteId}:
    parameters:
      - $ref: '#/components/parameters/HouseholdId'
      - name: inviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Invitations]
      summary: Revoke an invitation (owner only); revoking twice is a no-op
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/invites/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation as the authenticated caller
      description: |
        The token is accepted only in the JSON body, never in a path or query string. Unknown,
        malformed, revoked, expired and used-up tokens all receive the same 410 response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
              additionalProperties: false
      responses:
        '200':
          description: Joined; the household with the caller's role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
        '409': { $ref: '#/components/responses/RuleConflict' }
        '410': { $ref: '#/components/responses/InvitationUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/sync:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - name: since
        in: query
        required: false
        description: Last list version the client holds; omit for a full snapshot.
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Sync]
      summary: Poll a list; returns a snapshot or the changes since a version
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    CognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token, not an ID token.
  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's nextCursor.
      schema: { type: string, minLength: 1, maxLength: 512 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    UserProfile:
      type: object
      required: [id, displayName, version]
      properties:
        id: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
    ShoppingListSummary:
      type: object
      required: [id, name, type, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [PERSONAL, HOUSEHOLD] }
        householdId:
          type: string
          format: uuid
          description: Present exactly for household lists.
        version: { type: integer, minimum: 1 }
    ShoppingList:
      allOf:
        - $ref: '#/components/schemas/ShoppingListSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
            nextCursor: { type: string }
    ShoppingItem:
      type: object
      required: [id, name, checked, position, itemVersion]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: string, maxLength: 40 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
        checked: { type: boolean }
        position: { type: integer, minimum: 0 }
        itemVersion: { type: integer, minimum: 1 }
    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShoppingItem' }
        nextCursor: { type: string }
    ItemMutationResult:
      type: object
      required: [item, listVersion]
      properties:
        item: { $ref: '#/components/schemas/ShoppingItem' }
        listVersion: { type: integer, minimum: 1 }
    ListVersion:
      type: object
      required: [listVersion]
      properties:
        listVersion: { type: integer, minimum: 1 }
    CreateItemRequest:
      type: object
      required: [expectedListVersion, name]
      properties:
        expectedListVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: string, maxLength: 40 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    UpdateItemRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: Expected item version }
        checked: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: string, maxLength: 40 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    HouseholdName: { type: string, minLength: 1, maxLength: 80 }
    HouseholdRole: { type: string, enum: [OWNER, MEMBER] }
    HouseholdSummary:
      type: object
      required: [id, name, role, version]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/HouseholdName' }
        role:
          allOf:
            - $ref: '#/components/schemas/HouseholdRole'
          description: The caller's role.
        version: { type: integer, minimum: 1 }
    HouseholdMember:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { $ref: '#/components/schemas/HouseholdRole' }
    Household:
      allOf:
        - $ref: '#/components/schemas/HouseholdSummary'
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items: { $ref: '#/components/schemas/HouseholdMember' }
    ListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShoppingListSummary' }
        nextCursor: { type: string }
    CreateInviteRequest:
      type: object
      properties:
        maxUses: { type: integer, minimum: 1, maximum: 10, default: 5 }
        expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
      additionalProperties: false
    CreatedInvite:
      type: object
      required: [inviteId, token, inviteUrl, expiresAt, maxUses]
      properties:
        inviteId: { type: string, format: uuid }
        token:
          type: string
          minLength: 43
          description: Bearer secret (256 bits, base64url). Shown once; never stored or logged.
        inviteUrl:
          type: string
          format: uri
          description: '`{PUBLIC_APP_BASE_URL}/invite#token={token}`; the token is in the fragment.'
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 10 }
    Invite:
      type: object
      required: [inviteId, createdBy, expiresAt, maxUses, usedCount, status]
      properties:
        inviteId: { type: string, format: uuid }
        createdBy: { type: string }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 10 }
        usedCount: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED, USED_UP] }
    ExportedItem:
      allOf:
        - $ref: '#/components/schemas/ShoppingItem'
        - type: object
          required: [createdBy]
          properties:
            createdBy: { type: string }
    AccountExport:
      type: object
      required: [formatVersion, exportedAt, userId, profile, households, lists]
      properties:
        formatVersion: { type: integer, const: 1 }
        exportedAt: { type: string, format: date-time }
        userId: { type: string }
        profile:
          oneOf:
            - $ref: '#/components/schemas/UserProfile'
            - type: 'null'
        households:
          type: array
          items: { $ref: '#/components/schemas/HouseholdSummary' }
        lists:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/ShoppingListSummary'
              - type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExportedItem' }
    SyncResponse:
      oneOf:
        - type: object
          required: [kind, version, list, items]
          properties:
            kind: { type: string, const: snapshot }
            version: { type: integer, minimum: 1 }
            list: { $ref: '#/components/schemas/ShoppingListSummary' }
            items:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
        - type: object
          required: [kind, version, since, list, changed, removed]
          properties:
            kind: { type: string, const: changes }
            version: { type: integer, minimum: 1 }
            since: { type: integer, minimum: 1 }
            list: { $ref: '#/components/schemas/ShoppingListSummary' }
            changed:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
            removed:
              type: array
              items: { type: string }
      discriminator:
        propertyName: kind
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Resource access denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid input (validation, query parameters or unsupported combination)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RuleConflict:
      description: |
        Stale `expectedVersion` (`version_conflict`) or a business rule: `household_limit_reached`,
        `member_limit_reached`, `list_limit_reached`, `invitation_limit_reached`,
        `already_member` or `owner_must_transfer_ownership`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvitationUnavailable:
      description: |
        `invitation_unavailable`: the token is unknown, malformed, revoked, expired or used up.
        The cases are deliberately indistinguishable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body exceeds 16 KiB
    TooManyRequests:
      description: Per-principal request budget exhausted (ADR 016)
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Authentication, persistence or throttling is unavailable (fail closed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
