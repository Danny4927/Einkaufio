openapi: 3.1.0
info:
  title: Einkaufio API
  version: 1.0.0
  description: |
    Platform-neutral REST API used by the Angular PWA and future native Android client.
    Authenticated endpoints require a Cognito access token. The API is the source of truth
    for authorization and business rules.
servers:
  - url: https://{apiHost}
    variables:
      apiHost:
        default: example.lambda-url.eu-central-1.on.aws
security:
  - CognitoAccessToken: []
tags:
  - name: Profile
  - name: Lists
  - name: Items
  - name: Households
  - name: Invitations
  - name: Sync
paths:
  /health:
    get:
      security: []
      tags: [Profile]
      summary: Minimal health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/me:
    get:
      tags: [Profile]
      summary: Get current profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
              additionalProperties: false
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
  /api/lists:
    get:
      tags: [Lists]
      summary: List personal lists accessible to current user
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Personal lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AuthenticationUnavailable' }
    post:
      tags: [Lists]
      summary: Create a personal list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '201':
          description: Created list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/AuthenticationUnavailable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Lists]
      summary: Get list metadata and item page
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Shopping list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingList' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Lists]
      summary: Rename a list (owner/admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedVersion]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Lists]
      summary: Delete a list (owner/admin only)
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/lists/{listId}/items:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Items]
      summary: Add an item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          description: Created item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingItem' }
  /api/lists/{listId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Items]
      summary: Update item with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingItem' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Items]
      summary: Delete item with optimistic concurrency
      parameters:
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/households:
    get:
      tags: [Households]
      summary: List households for current user
      responses:
        '200':
          description: Households
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HouseholdSummary' }
    post:
      tags: [Households]
      summary: Create household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '201':
          description: Created household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
  /api/households/{householdId}:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Households]
      summary: Get household and member summaries
      responses:
        '200':
          description: Household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
    patch:
      tags: [Households]
      summary: Rename household (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedVersion]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Households]
      summary: Begin household deletion (owner only; cascade is bounded/backgrounded)
      responses:
        '202': { description: Deletion accepted }
  /api/households/{householdId}/lists:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Households]
      summary: List household lists
      responses:
        '200':
          description: Lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPage' }
    post:
      tags: [Households]
      summary: Create household-owned list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Created list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
  /api/households/{householdId}/members/{userId}:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Households]
      summary: Remove a member or leave; owner transfer required for current owner
      responses:
        '204': { description: Membership removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/lists/{listId}/invites:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Invitations]
      summary: Create invitation to personal list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Raw token returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
  /api/households/{householdId}/invites:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Invitations]
      summary: Create household invitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Raw token returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
  /api/invites/accept:
    post:
      tags: [Invitations]
      summary: Accept invitation as authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 512 }
              additionalProperties: false
      responses:
        '200': { description: Accepted or already a member }
        '410': { description: Expired, revoked or exhausted invitation }
  /api/invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Invitations]
      summary: Revoke invitation (creator or resource owner)
      responses:
        '204': { description: Revoked }
  /api/lists/{listId}/sync:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - name: sinceVersion
        in: query
        required: true
        schema: { type: integer, minimum: 0 }
      - $ref: '#/components/parameters/Cursor'
    get:
      tags: [Sync]
      summary: Poll list; return item snapshot only when the version changed
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    CognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token, not an ID token.
  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    UserProfile:
      type: object
      required: [id, displayName]
      properties:
        id: { type: string }
        displayName: { type: string }
        email: { type: string, format: email }
    ShoppingListSummary:
      type: object
      required: [id, name, type, role, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [PERSONAL, HOUSEHOLD] }
        role: { type: string, enum: [OWNER, MEMBER] }
        householdId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    ShoppingList:
      allOf:
        - $ref: '#/components/schemas/ShoppingListSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
            nextCursor: { type: string }
    ShoppingItem:
      type: object
      required: [id, name, checked, itemVersion]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
        checked: { type: boolean }
        position: { type: number }
        itemVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateItemRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
        position: { type: number }
      additionalProperties: false
    UpdateItemRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 160 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
        checked: { type: boolean }
        position: { type: number }
      additionalProperties: false
    HouseholdSummary:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [OWNER, MEMBER] }
        memberCount: { type: integer, minimum: 1 }
    Household:
      allOf:
        - $ref: '#/components/schemas/HouseholdSummary'
        - type: object
          properties:
            members:
              type: array
              items:
                type: object
                required: [userId, role]
                properties:
                  userId: { type: string }
                  displayName: { type: string }
                  role: { type: string, enum: [OWNER, MEMBER] }
    ListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShoppingListSummary' }
        nextCursor: { type: string }
    CreateInviteRequest:
      type: object
      properties:
        maxUses: { type: integer, minimum: 1, maximum: 10, default: 5 }
        expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
      additionalProperties: false
    CreatedInvite:
      type: object
      required: [inviteId, inviteUrl, expiresAt]
      properties:
        inviteId: { type: string, format: uuid }
        inviteUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SyncResponse:
      oneOf:
        - type: object
          required: [changed, version]
          properties:
            changed: { type: boolean, const: false }
            version: { type: integer }
        - type: object
          required: [changed, version, items]
          properties:
            changed: { type: boolean, const: true }
            version: { type: integer }
            items:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
            nextCursor: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AuthenticationUnavailable:
      description: Authentication configuration or Cognito JWKS service is unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Resource access denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
