openapi: 3.1.0
info:
  title: Einkaufio API
  version: 1.0.0
  description: |
    Platform-neutral REST API used by the Angular PWA and future native Android client.
    Authenticated endpoints require a Cognito access token. The API is the source of truth
    for authorization and business rules.
servers:
  - url: https://{apiHost}
    variables:
      apiHost:
        default: example.lambda-url.eu-central-1.on.aws
security:
  - CognitoAccessToken: []
tags:
  - name: Profile
  - name: Lists
  - name: Items
  - name: Households
  - name: Invitations
  - name: Sync
paths:
  /health:
    get:
      security: []
      tags: [Profile]
      summary: Minimal health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/me:
    get:
      tags: [Profile]
      summary: Get the caller's profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Profile]
      summary: Create (no expectedVersion) or update (with expectedVersion) the caller's profile
      description: The profile id is always the verified principal; it cannot be supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 80 }
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '201':
          description: Created profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists:
    get:
      tags: [Lists]
      summary: List shopping lists accessible to the current user
      description: |
        Owned personal lists and lists of households in which the caller is an active member
        (ADR 015). Access is resolved from persisted ownership and membership on every request.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Accessible lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Lists]
      summary: Create a personal list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '201':
          description: Created list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
    patch:
      tags: [Lists]
      summary: Rename a list (administrator only)
      description: Contributors receive 403; callers without access receive 404 (no existence leak).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedVersion]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                expectedVersion: { type: integer, minimum: 1 }
              additionalProperties: false
      responses:
        '200':
          description: Renamed list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Lists]
      summary: Delete a list and its items (administrator only)
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/items:
    parameters:
      - $ref: '#/components/parameters/ListId'
    get:
      tags: [Items]
      summary: Page through the items of a list in position order
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Item page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Items]
      summary: Add an item with the expected list version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '201':
          description: Created item and new list version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemMutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ItemId'
    patch:
      tags: [Items]
      summary: Check/uncheck or update item details with optimistic concurrency
      description: |
        Send either `checked` alone, or `name` with optional `quantity`, `unit` and `note`.
        Mixing both or sending neither is rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: Updated item and new list version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemMutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [Items]
      summary: Delete item with optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: Deleted; new list version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListVersion' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/lists/{listId}/item-order:
    parameters:
      - $ref: '#/components/parameters/ListId'
    put:
      tags: [Items]
      summary: Reorder items; index n in itemIds becomes position n
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedListVersion, itemIds]
              properties:
                expectedListVersion: { type: integer, minimum: 1 }
                itemIds:
                  type: array
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string }
              additionalProperties: false
      responses:
        '200':
          description: Reordered items and new list version
          content:
            application/json:
              schema:
                type: object
                required: [items, listVersion]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ShoppingItem' }
                  listVersion: { type: integer, minimum: 1 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /api/households:
    get:
      tags: [Households]
      summary: List households for current user
      responses:
        '200':
          description: Households
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HouseholdSummary' }
    post:
      tags: [Households]
      summary: Create household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
              additionalProperties: false
      responses:
        '201':
          description: Created household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdSummary' }
  /api/households/{householdId}:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Households]
      summary: Get household and member summaries
      responses:
        '200':
          description: Household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
    patch:
      tags: [Households]
      summary: Rename household (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, expectedVersion]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                expectedVersion: { type: integer, minimum: 1 }
      responses:
        '200': { description: Updated }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Households]
      summary: Begin household deletion (owner only; cascade is bounded/backgrounded)
      responses:
        '202': { description: Deletion accepted }
  /api/households/{householdId}/lists:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Households]
      summary: List household lists
      responses:
        '200':
          description: Lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPage' }
    post:
      tags: [Households]
      summary: Create household-owned list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201':
          description: Created list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingListSummary' }
  /api/households/{householdId}/members/{userId}:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: userId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Households]
      summary: Remove a member or leave; owner transfer required for current owner
      responses:
        '204': { description: Membership removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/lists/{listId}/invites:
    parameters:
      - $ref: '#/components/parameters/ListId'
    post:
      tags: [Invitations]
      summary: Create invitation to personal list (deferred to v1.x, ADR 015)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Raw token returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
  /api/households/{householdId}/invites:
    parameters:
      - name: householdId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Invitations]
      summary: Create household invitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInviteRequest' }
      responses:
        '201':
          description: Raw token returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvite' }
  /api/invites/accept:
    post:
      tags: [Invitations]
      summary: Accept invitation as authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 32, maxLength: 512 }
              additionalProperties: false
      responses:
        '200': { description: Accepted or already a member }
        '410': { description: 'Expired, revoked or exhausted invitation' }
  /api/invites/{inviteId}:
    parameters:
      - name: inviteId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Invitations]
      summary: Revoke invitation (creator or resource owner)
      responses:
        '204': { description: Revoked }
  /api/lists/{listId}/sync:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - name: since
        in: query
        required: false
        description: Last list version the client holds; omit for a full snapshot.
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Sync]
      summary: Poll a list; returns a snapshot or the changes since a version
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    CognitoAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito access token, not an ID token.
  parameters:
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's nextCursor.
      schema: { type: string, minLength: 1, maxLength: 512 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    UserProfile:
      type: object
      required: [id, displayName, version]
      properties:
        id: { type: string }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        version: { type: integer, minimum: 1 }
    ShoppingListSummary:
      type: object
      required: [id, name, type, role, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [PERSONAL, HOUSEHOLD] }
        role: { type: string, enum: [OWNER, MEMBER] }
        householdId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    ShoppingList:
      allOf:
        - $ref: '#/components/schemas/ShoppingListSummary'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
            nextCursor: { type: string }
    ShoppingItem:
      type: object
      required: [id, name, checked, position, itemVersion]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: string, maxLength: 40 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
        checked: { type: boolean }
        position: { type: integer, minimum: 0 }
        itemVersion: { type: integer, minimum: 1 }
    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShoppingItem' }
        nextCursor: { type: string }
    ItemMutationResult:
      type: object
      required: [item, listVersion]
      properties:
        item: { $ref: '#/components/schemas/ShoppingItem' }
        listVersion: { type: integer, minimum: 1 }
    ListVersion:
      type: object
      required: [listVersion]
      properties:
        listVersion: { type: integer, minimum: 1 }
    CreateItemRequest:
      type: object
      required: [expectedListVersion, name]
      properties:
        expectedListVersion: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: string, maxLength: 40 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    UpdateItemRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1, description: Expected item version }
        checked: { type: boolean }
        name: { type: string, minLength: 1, maxLength: 120 }
        quantity: { type: string, maxLength: 40 }
        unit: { type: string, maxLength: 40 }
        note: { type: string, maxLength: 500 }
      additionalProperties: false
    HouseholdSummary:
      type: object
      required: [id, name, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [OWNER, MEMBER] }
        memberCount: { type: integer, minimum: 1 }
    Household:
      allOf:
        - $ref: '#/components/schemas/HouseholdSummary'
        - type: object
          properties:
            members:
              type: array
              items:
                type: object
                required: [userId, role]
                properties:
                  userId: { type: string }
                  displayName: { type: string }
                  role: { type: string, enum: [OWNER, MEMBER] }
    ListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShoppingListSummary' }
        nextCursor: { type: string }
    CreateInviteRequest:
      type: object
      properties:
        maxUses: { type: integer, minimum: 1, maximum: 10, default: 5 }
        expiresInDays: { type: integer, minimum: 1, maximum: 30, default: 7 }
      additionalProperties: false
    CreatedInvite:
      type: object
      required: [inviteId, inviteUrl, expiresAt]
      properties:
        inviteId: { type: string, format: uuid }
        inviteUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    SyncResponse:
      oneOf:
        - type: object
          required: [kind, version, list, items]
          properties:
            kind: { type: string, const: snapshot }
            version: { type: integer, minimum: 1 }
            list: { $ref: '#/components/schemas/ShoppingListSummary' }
            items:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
        - type: object
          required: [kind, version, since, list, changed, removed]
          properties:
            kind: { type: string, const: changes }
            version: { type: integer, minimum: 1 }
            since: { type: integer, minimum: 1 }
            list: { $ref: '#/components/schemas/ShoppingListSummary' }
            changed:
              type: array
              items: { $ref: '#/components/schemas/ShoppingItem' }
            removed:
              type: array
              items: { type: string }
      discriminator:
        propertyName: kind
  responses:
    Unauthorized:
      description: Missing or invalid authentication
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Resource access denied
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Optimistic concurrency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid input (validation, query parameters or unsupported combination)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Request body exceeds 16 KiB
    TooManyRequests:
      description: Per-principal request budget exhausted (ADR 016)
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: Authentication, persistence or throttling is unavailable (fail closed)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
